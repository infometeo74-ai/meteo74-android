plugins { id 'com.android.application' }
android {
    namespace 'fr.meteo74.android'
    compileSdk 35
    defaultConfig {
        applicationId 'fr.meteo74.android'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.3.4'
    }
    signingConfigs {
        release {
            storeFile file('../.signing/meteo74.jks')
            storePassword System.getenv('METEO74_SIGNING_PASSWORD')
            keyAlias 'meteo74'
            keyPassword System.getenv('METEO74_SIGNING_PASSWORD')
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
